[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "0.1.0"
description = "Offline scanner for leaked secrets in repos, Docker images and CI logs, ranked by exploitability with rotation steps"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
leakguard = "leakguard.cli:main"

[tool.setuptools]
packages = ["leakguard"]
